name: CI

# Este workflow checa E publica.
#
# A publicação saiu da integração Git da Vercel e veio para cá porque aquela
# recusa deployment cujo autor do commit não esteja vinculado à conta Vercel —
# em conta Hobby, isso é todo mundo menos o dono. Os merges da Bianca voltavam
# como "Deployment was blocked" e o site ficou quatro dias parado enquanto a main
# já tinha a trilha nova. Deploy por CLI é autenticado pelo token, não pelo autor
# do commit, então não esbarra nessa checagem.
#
# Efeito colateral bem-vindo: antes a Vercel publicava em paralelo ao CI, e um
# build quebrado ia ao ar do mesmo jeito. Agora publicar depende de verificar.
#
# Precisa de três secrets no repositório: VERCEL_TOKEN, VERCEL_ORG_ID e
# VERCEL_PROJECT_ID. E da integração Git desligada em Vercel → Settings → Git,
# senão ela continua criando um deployment bloqueado a cada push.
on:
  push:
    branches: [main]
  pull_request:

# Um push novo cancela o build anterior da mesma branch, que já não interessa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Tipos, build e links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Mesma faixa do engines.node do package.json, que é o que a Vercel lê.
          node-version: 22
          cache: npm

      # ci (e não install): respeita o package-lock.json à risca.
      - run: npm ci

      - name: Checagem de tipos
        run: npm run check

      - name: Build estático
        run: npm run build

      # O Astro não reclama de href para página inexistente — isso viraria 404
      # silencioso em produção. Ver scripts/checar-links.mjs.
      - name: Links internos
        run: npm run checar-links

  # ---------------------------------------------------------------------------
  # A prévia de cada PR, que era o que a Vercel dava antes.
  # Só para branch deste repositório, que é o caso de todos os PRs até hoje: PR
  # vindo de fork não recebe os secrets, e isso é proteção, não limitação.
  previa:
    name: Prévia do PR
    needs: verificar
    # O `vercel deploy` espera a Vercel terminar, e já ficou horas preso em
    # "Building…" quando o deployment não saía do lugar do lado dela. Falhar em
    # 10 min diz a mesma coisa e não queima os 2.000 min/mês do plano free.
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Pelo ambiente, e não por --token= na linha de comando: interpolação de
      # secret com espaço ou quebra de linha chega truncada e vira "not valid".
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm i -g vercel@latest

      - run: vercel pull --yes --environment=preview
      - run: vercel build

      - name: Publicar a prévia
        id: publicar
        run: echo "url=$(vercel deploy --prebuilt)" >> "$GITHUB_OUTPUT"

      # Um comentário só, reescrito a cada push — em vez de um por commit.
      - name: Comentar o endereço no PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: previa-vercel
          message: |
            **Prévia deste PR:** ${{ steps.publicar.outputs.url }}

            Sai do commit `${{ github.event.pull_request.head.sha }}` e é
            refeita a cada push nesta branch.

  # ---------------------------------------------------------------------------
  # Produção. Só na main, e só depois do verificar passar.
  publicar:
    name: Publicar em produção
    needs: verificar
    # O `vercel deploy` espera a Vercel terminar, e já ficou horas preso em
    # "Building…" quando o deployment não saía do lugar do lado dela. Falhar em
    # 10 min diz a mesma coisa e não queima os 2.000 min/mês do plano free.
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Fora do concurrency do topo de propósito: cancelar um deploy pela metade é
    # pior que deixar dois entrarem em fila.
    concurrency:
      group: publicar-producao
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Pelo ambiente, e não por --token= na linha de comando: interpolação de
      # secret com espaço ou quebra de linha chega truncada e vira "not valid".
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm i -g vercel@latest

      # pull traz as variáveis de ambiente e as configurações do projeto, para o
      # build daqui sair igual ao que a Vercel faria do lado dela.
      - run: vercel pull --yes --environment=production
      - run: vercel build --prod

      # --prebuilt: sobe o resultado pronto, não o código. Ela não builda de novo.
      - name: Publicar
        id: publicar
        run: echo "url=$(vercel deploy --prebuilt --prod)" >> "$GITHUB_OUTPUT"

      - name: Resumo
        run: |
          {
            echo "### Publicado"
            echo "- commit: \`${{ github.sha }}\`"
            echo "- quem empurrou: @${{ github.actor }}"
            echo "- endereço: ${{ steps.publicar.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
